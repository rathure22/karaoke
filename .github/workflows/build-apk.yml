name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build web UI
        working-directory: web
        run: |
          npm install
          cp vite.config.ts vite.config.apk.ts
          sed -i 's/command === "build" || isPreview/false/' vite.config.apk.ts
          sed -i 's/tanstackStart()/tanstackStart({ spa: { enabled: true, prerender: { outputPath: "\/index" } } })/' vite.config.apk.ts
          sed -i 's/defineConfig(({ command, isPreview }) => ({/defineConfig(({ command, isPreview }) => ({\n  base: ".\/",/' vite.config.apk.ts
          PATH="$PWD/node_modules/.bin:$PATH" node scripts/with-app-env.mjs vite build --config vite.config.apk.ts
          if [ -f dist/client/index.html ]; then
            echo "index.html OK"
          elif [ -f dist/client/_shell.html ]; then
            cp dist/client/_shell.html dist/client/index.html
          else
            echo "ERROR: no index.html"; ls -laR dist || true; exit 1
          fi
          echo "=== BEFORE ==="
          head -40 dist/client/index.html
          find dist/client -type f \( -name '*.html' -o -name '*.js' -o -name '*.css' -o -name '*.json' \) -print0 | \
            xargs -0 sed -i \
              -e 's|src="/assets/|src="./assets/|g' \
              -e 's|href="/assets/|href="./assets/|g' \
              -e 's|url(/assets/|url(./assets/|g' \
              -e 's|"/assets/|"./assets/|g' \
              -e "s|'/assets/|'./assets/|g" \
              -e 's|`/assets/|`./assets/|g' \
              -e 's|from "/assets/|from "./assets/|g' \
              -e 's|import("/assets/|import("./assets/|g'
          find dist/client -type f \( -name '*.html' -o -name '*.js' \) -print0 | \
            xargs -0 sed -i \
              -e 's|src="/_|src="./_|g' \
              -e 's|href="/_|href="./_|g' \
              -e 's|"/__grok/|"./__grok/|g'
          if ! grep -q '<base ' dist/client/index.html; then
            sed -i 's|<head>|<head><base href="./">|' dist/client/index.html || true
          fi
          echo "=== AFTER ==="
          head -50 dist/client/index.html
          grep -oE '["'\''](/assets/[^"'\'']+)["'\'']' dist/client/index.html | head -5 || echo "no absolute /assets left"
      - name: Copy web into app assets
        run: |
          mkdir -p app/src/main/assets/web
          cp -r web/dist/client/. app/src/main/assets/web/
          test -f app/src/main/assets/web/index.html
          echo "files: $(find app/src/main/assets/web -type f | wc -l)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Prepare signing (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > my-release-key.jks
            printf 'storeFile=my-release-key.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties
            echo "BUILD_TASK=assembleRelease" >> "$GITHUB_ENV"
          else
            echo "BUILD_TASK=assembleDebug" >> "$GITHUB_ENV"
          fi
      - name: Build
        run: gradle "$BUILD_TASK" --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyKaraoke-apk
          path: app/build/outputs/apk/**/*.apk
